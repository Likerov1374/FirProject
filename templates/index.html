<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Cookie Clicker</title>
</head>
<body>
    <!-- Выводим переменные, которые передал Flask -->
    <h2>{{ clicks }}</h2>

    <!-- Форма для клика -->
    <form method="POST" style="display: inline;">
        <button type="submit" name="action" value="click">click</button>
    </form>

    <!-- Форма для улучшения -->
    <form method="POST" style="display: inline;">
        <button type="submit" name="action" value="upgrade">upgrade</button>
    </form>

    <h3>Upgrade costs: {{ cost }}</h3>
    
    <!-- Показываем ошибку, если она есть -->
    {% if error_msg %}
        <h3 style="color: red;">{{ error_msg }}</h3>
    {% endif %}
</body>
</html>
